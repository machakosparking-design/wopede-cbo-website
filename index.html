    <!-- GitHub Pages subpath & SPA helper (universal compatibility for github.io and custom domains) -->
    <script>
      (function() {
        const repo = '/wopede-cbo-website';
        if (window.location.pathname.startsWith(repo)) {
          const subpath = window.location.pathname.slice(repo.length) || '/';
          window.history.replaceState(null, '', subpath + window.location.search + window.location.hash);

          const origPush = history.pushState;
          const origReplace = history.replaceState;
          history.pushState = function(state, title, url) {
            if (typeof url === 'string' && url.startsWith('/') && !url.startsWith(repo)) {
              url = repo + url;
            }
            return origPush.call(history, state, title, url);
          };
          history.replaceState = function(state, title, url) {
            if (typeof url === 'string' && url.startsWith('/') && !url.startsWith(repo)) {
              url = repo + url;
            }
            return origReplace.call(history, state, title, url);
          };

          const patchNode = function(node) {
            if (node.nodeType === 1) {
              const tag = node.tagName.toLowerCase();
              if ((tag === 'img' || tag === 'source' || tag === 'video') && node.getAttribute('src')) {
                const s = node.getAttribute('src');
                if (s.startsWith('/assets/')) node.setAttribute('src', repo + s);
              }
              const els = node.querySelectorAll ? node.querySelectorAll('img[src^="/assets/"], video[src^="/assets/"], source[src^="/assets/"]') : [];
              els.forEach(function(el) {
                el.setAttribute('src', repo + el.getAttribute('src'));
              });
            }
          };

          const observer = new MutationObserver(function(mutations) {
            for (var i = 0; i < mutations.length; i++) {
              var m = mutations[i];
              for (var j = 0; j < m.addedNodes.length; j++) {
                patchNode(m.addedNodes[j]);
              }
            }
          });
          observer.observe(document.documentElement, { childList: true, subtree: true });
        }
      })();
    </script>
